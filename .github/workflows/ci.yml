name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: codex-auth-helper.exe
          - os: macos-latest
            artifact: codex-auth-helper
          - os: ubuntu-latest
            artifact: codex-auth-helper
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Linux 需要的基本库（eframe/winit 运行时依赖）
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Run tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: codex-auth-helper-${{ matrix.os }}
          path: target/release/${{ matrix.artifact }}
          if-no-files-found: error
